# WSL remote connections for DeepSeek Harness (Codex-style).
#
# Only the Host plugin is inserted. The Windows execution providers, tools and
# Agent presets stay exactly as shipped: each WSL 2 distribution is a separate
# remote host that runs the user's own `dsh` inside WSL, reached through the
# stdio of `wsl.exe`, and listed in Settings → General.
- insert:
    - id: local-wsl-remote
      name: '@local/dsh-wsl-remote'
      config: {}
