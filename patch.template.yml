# WSL execution environment for DeepSeek Harness (VS Code Remote - WSL style).
#
# GENERATED by scripts/build-patch.mjs from patch.template.yml: @MODE@ is replaced by the
# MODE_EXPRESSION in lib/boot.js. Edit the template, not this file.
#
# The environment is fixed when DeepSeek Harness starts. @MODE@ reads
# <DSH home>/wsl-remote.json once per process and yields the selected
# distribution, or '' for this Windows PC. In WSL mode the Host's shared
# execution services (ctx.fs, ctx.subprocess, ctx.sandbox, ctx.shell) are the
# WSL providers below, so every session runs commands, file edits and searches
# inside Linux. Agent presets are unchanged. Settings → General rewrites the
# file and asks for a restart.
- insert:
    - id: local-wsl-remote
      name: '@local/dsh-wsl-remote'
      config: {}

    - id: local-wsl-connection
      name: '@local/dsh-wsl-remote/connection'
      disabled: !!js "!@MODE@"
      config:
        distro: !!js "@MODE@ || 'unused'"
        node: !!js "globalThis.__dshWslRemote.node"
        serverDir: !!js "globalThis.__dshWslRemote.serverDir"
        shell: !!js "globalThis.__dshWslRemote.shell"

    - id: local-wsl-fs
      name: '@local/dsh-wsl-remote/fs'
      disabled: !!js "!@MODE@"

    - id: local-wsl-subprocess
      name: '@local/dsh-wsl-remote/subprocess'
      disabled: !!js "!@MODE@"

    - id: local-wsl-sandbox
      name: '@local/dsh-wsl-remote/sandbox'
      disabled: !!js "!@MODE@"

    - id: local-wsl-shell
      name: '@local/dsh-wsl-remote/shell'
      disabled: !!js "!@MODE@"
      config:
        timeoutMs: 60000

# The Linux `bash` tool joins every Agent's catalog from the Host; the Host
# plugin hides each Agent's preset `pwsh` tool, whose commands would also run
# in Linux.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js "!@MODE@"

# Windows execution providers stand down while WSL is the environment.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: !!js "!!@MODE@"

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: !!js "!!@MODE@"

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js "process.platform !== 'win32' || !!@MODE@"

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: !!js "!!@MODE@"

# Programmatic tool calls and workflows start their Node worker inside WSL.
- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
  config:
    launch: !!js "@MODE@ ? { kind: 'node-script', executable: globalThis.__dshWslRemote.node, bootstrapPath: globalThis.__dshWslRemote.serverDir + '/ptc/process.js' } : undefined"
